<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F1E9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>bettertimer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <main class="app">
      <p class="brand">bettertimer</p>
      <p class="phase" id="phase" aria-live="polite">ON</p>

      <div class="timer" id="timer" aria-live="polite">
        <span class="timer__fill" id="fill" data-phase="on"></span>
        <input
          class="timer__time"
          id="time"
          type="text"
          inputmode="numeric"
          enterkeyhint="done"
          autocomplete="off"
          spellcheck="false"
          maxlength="5"
          value="1:00"
          readonly
          aria-label="Current interval time"
        />
      </div>

      <label class="next" id="nextBlock">
        <span class="next__label" id="nextLabel">Next off</span>
        <input
          class="next__time"
          id="nextTime"
          type="text"
          inputmode="numeric"
          enterkeyhint="done"
          autocomplete="off"
          spellcheck="false"
          maxlength="5"
          value="0:45"
          aria-label="Upcoming interval duration"
        />
      </label>

      <button type="button" class="control" id="control">Start</button>

      <div class="meta">
        <span class="lap" id="lap">Lap 0</span>
        <p class="hint" id="hint">hold start to reset</p>
      </div>
    </main>
    <script src="app.js?v=4"></script>
  </body>
</html>
